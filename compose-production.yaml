services:
  db:
    image: pgvector/pgvector:pg17
    container_name: fgb-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: example_db
    ports:
      - "5440:5432"
    restart: unless-stopped

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: fgb-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/example_db
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports:
      - "5555:5555"
    volumes:
      - ./backend:/app
      - /app/tmp
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.prod
    container_name: fgb-frontend
    # No host port needed — Caddy proxies internally
    # Port 3000 is still exposed within the Docker network
    expose:
      - "3000"
    restart: unless-stopped

    volumes:
      - ./src:/app/src
      - ./static:/app/static
      - ./vite.config.ts:/app/vite.config.ts
      - /app/node_modules
    depends_on:
      - backend

  # caddy:
  # image: caddy:2-alpine
  # restart: unless-stopped
  # ports:
  #   - "80:80"
  #   - "443:443"
  #   - "443:443/udp"
  # volumes:
  #   - ./caddy/Caddyfile:/etc/caddy/Caddyfile
  #   - caddy_data:/data
  #   - caddy_config:/config
  # depends_on:
  #   - frontend
  #   - backend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  uploads_data:
