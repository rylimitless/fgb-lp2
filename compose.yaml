services:
  db:
    image: pgvector/pgvector:pg17
    container_name: fgb-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: example_db
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 10

  embeddings:
    build:
      context: ./backend/embeddings
      dockerfile: Dockerfile
    container_name: fgb-embeddings
    ports:
      - "7100:7100"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:7100/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fgb-backend
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/example_db
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      EMBEDDINGS_URL: http://embeddings:7100/embeddings
    ports:
      - "5555:5555"
    volumes:
      - ./backend:/app
      - /app/tmp
    depends_on:
      db:
        condition: service_healthy
      embeddings:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: fgb-frontend
    ports:
      - "3038:5173"
    volumes:
      - ./src:/app/src
      - ./static:/app/static
      - ./vite.config.ts:/app/vite.config.ts
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
