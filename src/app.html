<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />

		<title>FGB Academy</title>
		<meta name="description" content="FGB Academy — a premium learning experience for employees, leaders, partners, and customers." />

		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/brand/app-icon.svg" />
		<link rel="mask-icon" href="%sveltekit.assets%/brand/app-icon-mono.svg" color="#00548e" />

		<meta name="theme-color" content="#00548e" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0a1828" media="(prefers-color-scheme: dark)" />
		<meta name="apple-mobile-web-app-title" content="FGB Academy" />
		<meta name="application-name" content="FGB Academy" />

		<meta property="og:type" content="website" />
		<meta property="og:title" content="FGB Academy" />
		<meta property="og:description" content="A premium learning experience for the FGB community." />
		<meta property="og:image" content="%sveltekit.assets%/brand/og-card.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="FGB Academy" />
		<meta name="twitter:description" content="A premium learning experience for the FGB community." />
		<meta name="twitter:image" content="%sveltekit.assets%/brand/og-card.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
