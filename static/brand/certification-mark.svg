<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="FGB Academy Certification">
  <title>FGB Academy  Certification Mark</title>
  <defs>
    <linearGradient id="cert-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecd994" />
      <stop offset="100%" stop-color="#bfa755" />
    </linearGradient>
    <radialGradient id="cert-shine" cx="50%" cy="32%" r="62%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <path id="cert-ring-text" d="M 60 60 m -42 0 a 42 42 0 1 1 84 0 a 42 42 0 1 1 -84 0" />
  </defs>

  <!-- Outer ring (gold) -->
  <circle cx="60" cy="60" r="56" fill="url(#cert-gold)" stroke="#8a7634" stroke-width="2" />
  <circle cx="60" cy="60" r="56" fill="url(#cert-shine)" />

  <!-- Inner navy disc -->
  <circle cx="60" cy="60" r="42" fill="#00548e" />

  <!-- Microcopy ring "CERTIFIED � FGB ACADEMY �" along the seam between gold and navy -->
  <text font-family="'Inter Variable', Inter, system-ui, sans-serif"
        font-size="7"
        font-weight="700"
        letter-spacing="0.32em"
        fill="#8a7634">
    <textPath href="#cert-ring-text" startOffset="0">CERTIFIED � FGB ACADEMY � CERTIFIED � FGB ACADEMY �</textPath>
  </text>

  <!-- Chevron mark + gold dot, white on navy -->
  <path d="M 38 80 L 60 42 L 82 80"
        fill="none"
        stroke="#ffffff"
        stroke-width="6.5"
        stroke-linecap="round"
        stroke-linejoin="round" />
  <circle cx="60" cy="68" r="4.5" fill="#d6c47e" />

  <!-- Subtle inner ring for depth -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.5" />
</svg>
